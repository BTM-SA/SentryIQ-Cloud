<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SentryIQ Cloud — Gallery</title>
    <style>
        :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { margin: 0; min-height: 100vh; background: Canvas; color: CanvasText; }
        main { width: min(720px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0; }
        h1 { margin-bottom: 8px; }
        p { opacity: .75; }
        .picker { display: block; width: 100%; padding: 16px; border: 2px dashed currentColor; border-radius: 14px; box-sizing: border-box; cursor: pointer; text-align: center; }
        input { display: none; }
        button { width: 100%; margin-top: 16px; padding: 14px 18px; border: 0; border-radius: 10px; cursor: pointer; font: inherit; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        #status { margin-top: 20px; white-space: pre-wrap; }
        #previews { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 20px; }
        #previews img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }
    </style>
</head>
<body>
<main>
    <h1>Gallery</h1>
    <p>Select one or more photos from your phone or computer.</p>

    <label class="picker" for="photos">Choose photos</label>
    <input id="photos" type="file" name="photos[]" accept="image/jpeg,image/png,image/gif,image/webp" multiple>

    <div id="previews" aria-live="polite"></div>
    <button id="upload" type="button" disabled>Upload photos</button>
    <div id="status" role="status"></div>
</main>

<script>
const input = document.getElementById('photos');
const upload = document.getElementById('upload');
const previews = document.getElementById('previews');
const status = document.getElementById('status');

input.addEventListener('change', () => {
    previews.replaceChildren();
    status.textContent = '';
    upload.disabled = input.files.length === 0;

    [...input.files].forEach(file => {
        const url = URL.createObjectURL(file);
        const image = document.createElement('img');
        image.src = url;
        image.alt = file.name;
        image.onload = () => URL.revokeObjectURL(url);
        previews.appendChild(image);
    });
});

upload.addEventListener('click', async () => {
    if (!input.files.length) return;

    upload.disabled = true;
    status.textContent = 'Uploading…';

    const form = new FormData();
    [...input.files].forEach(file => form.append('photos[]', file, file.name));

    try {
        const response = await fetch('gallery-upload.php', {
            method: 'POST',
            body: form,
            credentials: 'same-origin'
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Upload failed.');

        const stored = data.results?.filter(result => result.status === 'stored').length ?? 0;
        const duplicates = data.results?.filter(result => result.status === 'duplicate').length ?? 0;
        const rejected = data.results?.filter(result => result.status === 'rejected').length ?? 0;

        status.textContent = `Upload complete.\nStored: ${stored}\nDuplicates: ${duplicates}\nRejected: ${rejected}`;
    } catch (error) {
        status.textContent = error instanceof Error ? error.message : 'Upload failed.';
    } finally {
        upload.disabled = false;
    }
});
</script>
</body>
</html>
